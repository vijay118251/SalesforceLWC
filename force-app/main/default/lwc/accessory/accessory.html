<template>
    <div class="slds-card card">
        <div class="item-box">
            <div class="image-section">
                <img src={imageUrl} alt="Phone Case">
            </div>
            <div class="details-section">
                <p class="brand">Zagg</p>
                <p class="product-name">Zagg Picadilly Snap Case - iPhone 16 Pro Max</p>
                <p class="warranty"><a href="#">Lifetime warranty</a></p>
                <p class="sku">SKU: 123456789</p>
            </div>
            <div class="price-section">
                <p class="price">$30.00</p>
                <p class="old-price">$40.00</p>
            </div>
            <div class="quantity-section">
                <p>Quantity</p>
                <div class="quantity-box">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>
            <div class="delete-section">
                <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
            </div>
        </div>
    </div>
</template>
