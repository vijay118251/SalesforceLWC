<template>
    <lightning-card  title="CalcTest">
		<p class="slds-var-p-horizontal_small">
			<lightning-input name = "fnumber" value = {firstNumber} label = "First Number" onchange={handleChanges}></lightning-input>
			<lightning-input name = "snumber" value = {secondNumber} label = "Second Number" onchange={handleChanges}></lightning-input>
		</p>		
		<div slot="footer">
			<lightning-badge label={result}> </lightning-badge>
		</div>
	</lightning-card>
</template>
