<template>
    <lightning-card  variant="Narrow"  title="Create Account Using createRecord" icon-name="standard:account">
        <div class='slds-m-around_medium'>
            <lightning-input type="text" 
                             name="name"
                             label="Account Name" 
                             placeholder="Enter Account name"
                             onchange={handleNameChange}>                           
            </lightning-input>
            <br>
            <lightning-button variant="brand" 
                              label="Create Account" 
                              title="titleName" 
                              onclick={handleClick}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
