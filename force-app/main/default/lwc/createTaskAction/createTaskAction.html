<template>
    <lightning-quick-action-panel header="Task Manager">
        <c-create-task
            target-parent={isAction}
            lwc:ref="createToDo"
        ></c-create-task>
        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel"  onclick={cancelAction}></lightning-button>
            <lightning-button variant="brand" label="Save" class="slds-m-left_xx-small" onclick={handleClick}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
