<template>
    <lightning-card  variant="Narrow"  title="Customers" icon-name="standard:search">
        <div class='slds-m-around_medium'>
            <lightning-combobox
                    name="progress"
                    label="Status"
                    placeholder="search"
                    options={options}
                    onchange={handleChange}
                    required
            ></lightning-combobox>
        </div>
        <div class="slds-m-top_small slds-m-bottom_medium">
            <lightning-button variant="brand" label="Customer Search" onclick={handleClick} class="slds-m-left_x-small">
            </lightning-button>
        </div>
    </lightning-card>
</template>
