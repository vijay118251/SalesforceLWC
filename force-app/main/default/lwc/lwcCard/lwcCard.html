<template>
    <div class="slds-box slds-p-around_medium slds-theme_shade box">

        <div class="slds-grid slds-p-around_medium slds-theme_shade box">
        
        <div class="slds-col">
        
        <span class="slds-text-heading_large">DYNAMIC CARDS DESIGN</span>
        
        </div>
        
        </div>
        
        <div class="slds-grid slds-wrap">
        
        <template for:each={card} for:item="c">
        
        <div key={c.id} class="slds-col slds-size_1-of-5 slds-box slds-m-around_small zoom box margin-css">
        
        <div class="slds-grid slds-grid_vertical">
        
        <div class="slds-col slds-text-heading_medium">
        
        <img src={c.imageURL} width="100%" class="image-css">
        
        </div>
        
        <div class="slds-col slds-text-heading_small slds-p-top_small " style="height: 150px;">
        
        {c.subtitle}
        
        </div>
        
        <div class="slds-col slds-p-top_x-small">
        
        <div class="slds-grid slds-grid_align-end slds-border_top slds-p-top_x-small">
        
        <div class="slds-col slds-p-top_xxx-small">
        
        <img src={c.fbLogoURL} class="pointer" style="height: 24px;" onclick={handleFB} data-id={c.id}>
        
        </div>
        
        <div class="slds-col">
        
        <img src={c.linkedinLogoURL} class="pointer" style="height: 30px;" onclick={handleLinkedIn} data-id={c.id}>
        
        </div>
        
        </div>
        
        </div>
        
        </div>
        
        </div>
        
        </template>
        
        </div>
        
        </div>
</template>
