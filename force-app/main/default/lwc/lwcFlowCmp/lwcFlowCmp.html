<template>
    <lightning-card title="LWC Datatable" icon-name="custom:custom63">
    <div class="slds-m-around_medium">
    <div style="height: 300px;">
        <lightning-datatable
                key-field="Id"
                show-row-number-column  
                data={vehicleRecords}
                columns={columns}
                onsave={handleSave}
                draft-values={saveDraftValues}>
        </lightning-datatable>
    </div>
    </div>
    <div class="slds-m-around_medium">
    <!-- Neutral variant (default) -->
        <lightning-button label="Add Records" name="Add" onclick={handleClick} class="slds-m-left_x-small">
        </lightning-button>
    </div>
    </lightning-card>
</template>
