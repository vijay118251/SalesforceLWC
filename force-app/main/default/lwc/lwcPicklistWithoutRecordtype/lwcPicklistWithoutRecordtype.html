<template>
    <lightning-card  variant="Narrow"  title="Get Picklist Values" icon-name="standard:contact">
        <div class="slds-box">
        <template if:true={leadSourceValues.data}>
            <lightning-combobox name="progress" label="Lead Source" value={value}
                options={leadSourceValues.data.values} onchange={handleChange}>
            </lightning-combobox>
            <p>Selected value is: {value}</p>
        </template>
    </div>
    </lightning-card>
</template>
