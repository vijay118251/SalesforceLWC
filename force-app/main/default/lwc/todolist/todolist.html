<template>
    <template lwc:if={toDoList}>
        <lightning-card  title="Pending Tasks" icon-name="standard:task">
            <template for:each={toDoList} for:item="toDo">            
                <p class="slds-p-horizontal_small" key = {toDo.Id}> {toDo.Title__c}, {toDo.DueDate__c}</p>
            </template>      
        </lightning-card>
    </template>
</template>
