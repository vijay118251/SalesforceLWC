<template>
<lightning-card  variant="Narrow"  title="Update Account Details" icon-name="standard:account">
  <div class="slds-var-p-horizontal_small">
  <lightning-input
    name="name"
    value={name}
    label="Account Name"
    onchange={handleChange}
  ></lightning-input>
  <lightning-input
    name="rating"
    value={rating}
    label="Rating"
    onchange={handleChange}
  ></lightning-input>
  <lightning-input
    name="industry"
    value={industry}
    label="Industry"
    onchange={handleChange}
  ></lightning-input>
  </div>
  <p slot="footer">
      <lightning-button label="Update" onclick={handleClick}></lightning-button>
  </p>
</lightning-card>
</template>
